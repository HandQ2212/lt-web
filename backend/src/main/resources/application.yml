spring:
  application:
    name: system
  profiles:
    active: local
  datasource:
    # url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    # username: postgres
    # password: 123456
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ELC-HikariPool
      connection-test-query: SELECT 1
      # Disable prepared statement cache to prevent corruption
      prep-stmt-cache-size: 0
      prep-stmt-cache-sql-limit: 0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Disable prepared statement cache at Hibernate level
        jdbc:
          batch_versioned_data: false

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration: 86400000 # 24 hours in ms
    refresh-expiration: 604800000 # 7 days in ms

server:
  port: 8080

payroll:
  default-rate-per-session: ${PAYROLL_RATE:300000}

payment:
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMO_TMN}
    hash-secret: ${VNPAY_HASH_SECRET:DEMO_SECRET}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/result}
    ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay/ipn}
  momo:
    partner-code: ${MOMO_PARTNER_CODE:MOMO_DEMO}
    access-key: ${MOMO_ACCESS_KEY:DEMO_KEY}
    secret-key: ${MOMO_SECRET_KEY:DEMO_SECRET}
    pay-url: ${MOMO_PAY_URL:https://test-payment.momo.vn/v2/gateway/api/create}
    return-url: ${MOMO_RETURN_URL:http://localhost:3000/payment/result}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8080/api/payment/momo/ipn}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
