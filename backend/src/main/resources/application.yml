spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: system
  profiles:
    active: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: ELC-HikariPool
      connection-test-query: SELECT 1
      # Disable prepared statement cache to prevent corruption
      prep-stmt-cache-size: 0
      prep-stmt-cache-sql-limit: 0
  jpa:
    open-in-view: false
    hibernate:
      # Schema is managed by SQL migrations / init scripts, so avoid Hibernate auto-update on startup.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: truew
        # Disable prepared statement cache at Hibernate level
        jdbc:
          batch_versioned_data: false
 
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration: 86400000 # 24 hours in ms
    refresh-expiration: 604800000 # 7 days in ms

payos:
  client-id: ${PAYOS_CLIENT_ID:YOUR_CLIENT_ID}
  api-key: ${PAYOS_API_KEY:YOUR_API_KEY}
  checksum-key: ${PAYOS_CHECKSUM_KEY:YOUR_CHECKSUM_KEY}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}
  responses-url: ${OPENAI_RESPONSES_URL:https://api.openai.com/v1/responses}
  timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:20}
  max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2000}
  reasoning-effort: ${OPENAI_REASONING_EFFORT:low}

server:
  address: localhost
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
